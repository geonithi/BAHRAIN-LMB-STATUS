<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link rel="stylesheet" type="text/css" href="resources/horsey.min.css">
    <link rel="stylesheet" type="text/css" href="resources/ol3-search-layer.min.css">
    <link href="resources/ol-geocoder.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>
        html, body {
            background-color: #ffffff;
        }

        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        .ol-control > * {
            background-color: #f8f8f8 !important;
            color: #444444 !important;
            border-radius: 0px;
        }

        .ol-attribution a,
        .gcd-gl-input::placeholder,
        .search-layer-input-search::placeholder {
            color: #444444 !important;
        }

        .search-layer-input-search {
            background-color: #f8f8f8 !important;
        }

        .ol-control > *:focus,
        .ol-control > *:hover {
            background-color: rgba(248, 248, 248, 0.7) !important;
        }

        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        }

        /* Password overlay screen */
        #lockScreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: Arial, sans-serif;
        }

        #lockScreen input {
            padding: 10px;
            font-size: 18px;
            width: 200px;
            text-align: center;
        }

        #lockScreen button {
            padding: 10px 25px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Heading overlay */
        #headingOverlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #5bd0be80;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1100;
            font-family: Arial, sans-serif;
            font-size: 24px;
            color: #000;
            pointer-events: none;
        }

        /* Logo */
        .logo-bottom-left {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 1000;
        }

        .logo-bottom-left img {
            max-width: 100px;
            height: auto;
        }
    </style>
</head>

<body>

    <!-- 🔐 PASSWORD SCREEN -->
    <div id="lockScreen">
        <h2>Enter Password</h2>
        <input type="password" id="passInput" placeholder="Password">
        <button onclick="unlockPage()">Submit</button>
    </div>

    <script>
        function unlockPage() {
            const correctPassword = "RmSi@2025";  // 🔐 CHANGE PASSWORD HERE
            const userInput = document.getElementById("passInput").value;

            if (userInput === correctPassword) {
                document.getElementById("lockScreen").style.display = "none";
            } else {
                alert("Incorrect password");
            }
        }
    </script>

    <!-- Heading overlay -->
    <div id="headingOverlay">BAHRAIN LMB STATUS</div>

    <!-- Fixed logo -->
    <div class="logo-bottom-left">
        <img src="images/123.jpg" alt="Logo">
    </div>

    <!-- Map container -->
    <div id="map">
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="resources/qgis2web_expressions.js"></script>
    <script src="./resources/functions.js"></script>
    <script src="./resources/ol.js"></script>
    <script src="resources/horsey.min.js"></script>
    <script src="resources/ol3-search-layer.js"></script>
    <script src="./resources/ol-layerswitcher.js"></script>
    <script src="resources/ol-geocoder.js"></script>
    <script src="layers/BAH_LMB_1.js"></script>
    <script src="styles/BAH_LMB_1_style.js"></script>
    <script src="./layers/layers.js" type="text/javascript"></script>
    <script src="./resources/Autolinker.min.js"></script>
    <script src="./resources/qgis2web.js"></script>

</body>
</html>
